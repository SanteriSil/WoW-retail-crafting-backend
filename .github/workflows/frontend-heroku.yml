name: Frontend CI/CD (Heroku)

on:
  push:
    branches: [main]
    paths:
      - "controlpanel/**"
      - ".github/workflows/frontend-heroku.yml"
  workflow_dispatch:

concurrency:
  group: frontend-heroku-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: controlpanel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: controlpanel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend subtree to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_FRONTEND_APP_NAME }}
        run: |
          set -euo pipefail
          FRONTEND_SHA=$(git subtree split --prefix controlpanel HEAD)
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" "${FRONTEND_SHA}:main" --force
