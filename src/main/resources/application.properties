spring.application.name=crafting project

# Default to dev locally, allow override in deployment with SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Base logging defaults (profile-specific files can override)
logging.level.org.springframework=INFO
logging.level.com.crafting=INFO

# Keep Postgres on the classpath but fall back to an embedded H2 DB for local dev if available.

server.port=8080

blizzard.clientId = ${BlizClient:}
blizzard.clientSecret = ${BlizSecret:}

discord.clientId = ${DISCORD_CLIENT_ID:}
discord.clientSecret = ${DISCORD_CLIENT_SECRET:}
jwt.secret = ${JWT_SECRET:dev-secret-change-me-in-production}

# Owner Discord snowflake ID — the single OWNER-role user (PLAN.md §4.2)
# Must be set via OWNER_DISCORD_ID environment variable in all non-dev environments
owner.discord-id=${OWNER_DISCORD_ID:}

# Scraper settings
scraper.base-url=https://www.wowhead.com
scraper.request-delay-ms=1500
scraper.user-agent=WoWCraftingBot/1.0
scraper.enabled=true

#logging stuff
logging.file.name=logs/crafting.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n%wEx