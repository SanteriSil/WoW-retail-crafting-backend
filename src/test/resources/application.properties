spring.application.name=crafting project test

# ── H2 in-memory database for tests ──
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable Flyway — migrations use PostgreSQL-specific syntax (DO $$ blocks, etc.)
spring.flyway.enabled=false

# ── JWT ──
jwt.secret=test-secret-key-for-unit-tests-that-is-at-least-32-bytes-long

# ── Owner (test value matches the seeded discord_id in V7) ──
owner.discord-id=148170052171071488

# ── Discord (dummy values – real OAuth is never called in tests) ──
discord.clientId=test-discord-client-id
discord.clientSecret=test-discord-client-secret

# ── Blizzard (dummy values) ──
blizzard.clientId=test-blizz-client-id
blizzard.clientSecret=test-blizz-client-secret

# ── CORS ──
cors.allowed-origins=http://localhost:5173

# ── Logging — minimal noise during test runs ──
logging.level.com.crafting=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
